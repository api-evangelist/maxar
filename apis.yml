      - Delivery
      - Processing
    properties:
      - type: Documentation
        url: https://developers.maxar.com/docs
  - aid: maxar:streaming-imagery
    name: Maxar Streaming Imagery API
    description: >-
      OGC-compliant WFS / WMS / WMTS streaming services for delivering online
